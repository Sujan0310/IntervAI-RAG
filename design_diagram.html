<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InterviewRAG System Design Diagram</title>
<style>
  body { background:#fff; font-family:Arial,sans-serif; margin:20px; }
  .title { text-align:center; font-size:16px; font-weight:bold; margin-bottom:10px; }
</style>
</head>
<body>
<div class="title">InterviewRAG — System Design Flowchart</div>
<svg width="1250" height="1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#444"/>
  </marker>
</defs>

<!-- ─────────────────────────────────────────────
     ROW 1  y=60   START → LOGIN → AUTH → UPLOAD → VALIDATION
     ───────────────────────────────────────────── -->

<!-- START -->
<ellipse cx="60" cy="60" rx="50" ry="22" fill="#e0e0e0" stroke="#555" stroke-width="2"/>
<text x="60" y="64" text-anchor="middle" font-size="11" font-weight="bold">START</text>

<line x1="110" y1="60" x2="165" y2="60" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- USER LOGIN / REGISTRATION -->
<rect x="165" y="40" width="140" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="235" y="57" text-anchor="middle" font-size="11" font-weight="bold">USER LOGIN /</text>
<text x="235" y="72" text-anchor="middle" font-size="11" font-weight="bold">REGISTRATION</text>

<line x1="305" y1="60" x2="355" y2="60" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- AUTHENTICATION diamond  cx=420 -->
<polygon points="420,35 490,60 420,85 350,60" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="420" y="59" text-anchor="middle" font-size="10" font-weight="bold">AUTHENTICATION</text>
<text x="420" y="74" text-anchor="middle" font-size="10" font-weight="bold">(JWT)</text>

<!-- YES → right -->
<text x="500" y="55" text-anchor="middle" font-size="10" fill="#333">YES</text>
<line x1="490" y1="60" x2="545" y2="60" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- UPLOAD RESUME -->
<rect x="545" y="40" width="150" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="620" y="57" text-anchor="middle" font-size="11" font-weight="bold">UPLOAD RESUME /</text>
<text x="620" y="72" text-anchor="middle" font-size="11" font-weight="bold">START INTERVIEW</text>

<line x1="695" y1="60" x2="750" y2="60" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- RESUME VALIDATION PIPELINE -->
<rect x="750" y="40" width="160" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="830" y="57" text-anchor="middle" font-size="11" font-weight="bold">RESUME VALIDATION</text>
<text x="830" y="72" text-anchor="middle" font-size="11" font-weight="bold">PIPELINE</text>

<!-- NO → down from AUTH -->
<text x="420" y="100" text-anchor="middle" font-size="10" fill="#333">NO</text>
<line x1="420" y1="85" x2="420" y2="120" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<!-- DENY -->
<ellipse cx="420" cy="142" rx="42" ry="20" fill="#e0e0e0" stroke="#555" stroke-width="2"/>
<text x="420" y="146" text-anchor="middle" font-size="11" font-weight="bold">DENY</text>

<!-- ─────────────────────────────────────────────
     ROW 2  y=160  VALIDATED? diamond
     ───────────────────────────────────────────── -->

<!-- Arrow VALIDATION → VALIDATED? -->
<line x1="830" y1="80" x2="830" y2="140" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- VALIDATED? diamond  cx=830 cy=170 -->
<polygon points="830,140 900,170 830,200 760,170" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="830" y="174" text-anchor="middle" font-size="11" font-weight="bold">VALIDATED?</text>

<!-- NO → left back to UPLOAD -->
<text x="748" y="165" text-anchor="middle" font-size="10" fill="#333">NO</text>
<line x1="760" y1="170" x2="695" y2="170" stroke="#444" stroke-width="1.8"/>
<line x1="695" y1="170" x2="695" y2="60" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- YES → down -->
<text x="835" y="215" text-anchor="middle" font-size="10" fill="#333">YES</text>
<line x1="830" y1="200" x2="830" y2="240" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─────────────────────────────────────────────
     ROW 3  y=240  CREATE SESSION → USER SELECTS DOMAIN → RAG → HYBRID
     ───────────────────────────────────────────── -->

<!-- CREATE INTERVIEW SESSION -->
<rect x="750" y="240" width="160" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="830" y="257" text-anchor="middle" font-size="11" font-weight="bold">CREATE INTERVIEW</text>
<text x="830" y="272" text-anchor="middle" font-size="11" font-weight="bold">SESSION</text>

<line x1="750" y1="260" x2="680" y2="260" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- USER SELECTS DOMAIN -->
<rect x="540" y="240" width="140" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="610" y="257" text-anchor="middle" font-size="11" font-weight="bold">USER SELECTS</text>
<text x="610" y="272" text-anchor="middle" font-size="11" font-weight="bold">DOMAIN</text>

<line x1="540" y1="260" x2="470" y2="260" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- RAG PIPELINE TRIGGERED -->
<rect x="340" y="240" width="130" height="40" rx="6" fill="#c8c8c8" stroke="#555" stroke-width="2.5"/>
<text x="405" y="257" text-anchor="middle" font-size="11" font-weight="bold">RAG PIPELINE</text>
<text x="405" y="272" text-anchor="middle" font-size="11" font-weight="bold">TRIGGERED</text>

<line x1="340" y1="260" x2="270" y2="260" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- HYBRID RETRIEVAL -->
<rect x="140" y="240" width="130" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="205" y="257" text-anchor="middle" font-size="11" font-weight="bold">HYBRID</text>
<text x="205" y="272" text-anchor="middle" font-size="11" font-weight="bold">RETRIEVAL</text>

<!-- ─────────────────────────────────────────────
     ROW 2.5  y=170  DENSE + SPARSE above HYBRID
     ───────────────────────────────────────────── -->

<!-- DENSE RETRIEVAL (FAISS) -->
<rect x="50" y="170" width="130" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="115" y="187" text-anchor="middle" font-size="11" font-weight="bold">DENSE RETRIEVAL</text>
<text x="115" y="202" text-anchor="middle" font-size="11" font-weight="bold">(FAISS)</text>
<line x1="115" y1="210" x2="115" y2="240" stroke="#444" stroke-width="1.8"/>
<line x1="115" y1="240" x2="155" y2="255" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- SPARSE RETRIEVAL (BM25) -->
<rect x="210" y="170" width="130" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="275" y="187" text-anchor="middle" font-size="11" font-weight="bold">SPARSE RETRIEVAL</text>
<text x="275" y="202" text-anchor="middle" font-size="11" font-weight="bold">(BM25)</text>
<line x1="275" y1="210" x2="275" y2="240" stroke="#444" stroke-width="1.8"/>
<line x1="275" y1="240" x2="255" y2="255" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─────────────────────────────────────────────
     ROW 4  y=340  RRF → SEND CONTEXT → LLM GENERATES → USER SUBMITS
     ───────────────────────────────────────────── -->

<!-- Arrow HYBRID → RRF (down) -->
<line x1="205" y1="280" x2="205" y2="340" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- RECIPROCAL RANK FUSION -->
<rect x="120" y="340" width="170" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="205" y="357" text-anchor="middle" font-size="11" font-weight="bold">RECIPROCAL RANK</text>
<text x="205" y="372" text-anchor="middle" font-size="11" font-weight="bold">FUSION (RRF)</text>

<line x1="205" y1="380" x2="205" y2="430" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- SEND CONTEXT TO LLM -->
<rect x="120" y="430" width="170" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="205" y="447" text-anchor="middle" font-size="11" font-weight="bold">SEND CONTEXT</text>
<text x="205" y="462" text-anchor="middle" font-size="11" font-weight="bold">TO LLM</text>

<line x1="290" y1="450" x2="340" y2="450" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- LLM GENERATES QUESTIONS -->
<rect x="340" y="430" width="160" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="420" y="447" text-anchor="middle" font-size="11" font-weight="bold">LLM GENERATES</text>
<text x="420" y="462" text-anchor="middle" font-size="11" font-weight="bold">QUESTIONS</text>

<line x1="500" y1="450" x2="550" y2="450" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- USER SUBMITS ANSWER -->
<rect x="550" y="430" width="150" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="625" y="447" text-anchor="middle" font-size="11" font-weight="bold">USER SUBMITS</text>
<text x="625" y="462" text-anchor="middle" font-size="11" font-weight="bold">ANSWER</text>

<line x1="700" y1="450" x2="750" y2="450" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─────────────────────────────────────────────
     EVAL MODE? diamond  cx=820 cy=450
     ───────────────────────────────────────────── -->

<polygon points="820,420 900,450 820,480 740,450" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="820" y="446" text-anchor="middle" font-size="11" font-weight="bold">EVAL</text>
<text x="820" y="460" text-anchor="middle" font-size="11" font-weight="bold">MODE?</text>

<!-- ─────────────────────────────────────────────
     SEMANTIC branch — goes UP from diamond
     ───────────────────────────────────────────── -->
<text x="820" y="412" text-anchor="middle" font-size="10" fill="#333">SEMANTIC</text>
<line x1="820" y1="420" x2="820" y2="370" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- SEMANTIC SIMILARITY box -->
<rect x="730" y="330" width="180" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="820" y="347" text-anchor="middle" font-size="11" font-weight="bold">SEMANTIC SIMILARITY</text>
<text x="820" y="362" text-anchor="middle" font-size="11" font-weight="bold">(WORD MATCHING)</text>

<!-- ─────────────────────────────────────────────
     LLM branch — goes RIGHT from diamond
     ───────────────────────────────────────────── -->
<text x="912" y="445" text-anchor="middle" font-size="10" fill="#333">LLM</text>
<line x1="900" y1="450" x2="960" y2="450" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- LLM EVALUATION box -->
<rect x="960" y="430" width="170" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="1045" y="447" text-anchor="middle" font-size="11" font-weight="bold">LLM EVALUATION</text>
<text x="1045" y="462" text-anchor="middle" font-size="11" font-weight="bold">(DEEP FEEDBACK)</text>

<!-- ─────────────────────────────────────────────
     Both paths → SCORE & FEEDBACK  cy=540
     ───────────────────────────────────────────── -->

<!-- Semantic → route RIGHT of LLM box, then down to SCORE -->
<line x1="820" y1="330" x2="820" y2="310" stroke="#444" stroke-width="1.8"/>
<line x1="820" y1="310" x2="1160" y2="310" stroke="#444" stroke-width="1.8"/>
<line x1="1160" y1="310" x2="1160" y2="550" stroke="#444" stroke-width="1.8"/>
<line x1="1160" y1="550" x2="1130" y2="550" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- LLM → down -->
<line x1="1045" y1="470" x2="1045" y2="530" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- SCORE & FEEDBACK -->
<rect x="960" y="530" width="170" height="40" rx="6" fill="#c8dfc8" stroke="#447744" stroke-width="2"/>
<text x="1045" y="547" text-anchor="middle" font-size="11" font-weight="bold">SCORE &amp;</text>
<text x="1045" y="562" text-anchor="middle" font-size="11" font-weight="bold">FEEDBACK</text>

<!-- ─────────────────────────────────────────────
     ADAPTIVE DIFFICULTY ENGINE  cy=630
     ───────────────────────────────────────────── -->
<line x1="1045" y1="570" x2="1045" y2="620" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<rect x="960" y="620" width="170" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="1045" y="637" text-anchor="middle" font-size="11" font-weight="bold">ADAPTIVE</text>
<text x="1045" y="652" text-anchor="middle" font-size="11" font-weight="bold">DIFFICULTY ENGINE</text>

<!-- ─────────────────────────────────────────────
     END INTERVIEW? diamond  cx=820 cy=720
     ───────────────────────────────────────────── -->
<line x1="1045" y1="660" x2="1045" y2="720" stroke="#444" stroke-width="1.8"/>
<line x1="1045" y1="720" x2="900" y2="720" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<polygon points="820,690 900,720 820,750 740,720" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="820" y="716" text-anchor="middle" font-size="11" font-weight="bold">END</text>
<text x="820" y="730" text-anchor="middle" font-size="11" font-weight="bold">INTERVIEW?</text>

<!-- NO → loop back up to LLM GENERATES -->
<text x="820" y="682" text-anchor="middle" font-size="10" fill="#333">NO</text>
<line x1="820" y1="690" x2="820" y2="660" stroke="#444" stroke-width="1.8"/>
<line x1="820" y1="660" x2="420" y2="660" stroke="#444" stroke-width="1.8"/>
<line x1="420" y1="660" x2="420" y2="470" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- YES → left to STORED IN DATABASE -->
<text x="728" y="715" text-anchor="middle" font-size="10" fill="#333">YES</text>
<line x1="740" y1="720" x2="650" y2="720" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- INTERVIEW STORED IN DATABASE -->
<rect x="480" y="700" width="170" height="40" rx="6" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<text x="565" y="717" text-anchor="middle" font-size="11" font-weight="bold">INTERVIEW STORED</text>
<text x="565" y="732" text-anchor="middle" font-size="11" font-weight="bold">IN DATABASE</text>

<line x1="480" y1="720" x2="400" y2="720" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- END oval -->
<ellipse cx="350" cy="720" rx="50" ry="22" fill="#e0e0e0" stroke="#555" stroke-width="2"/>
<text x="350" y="724" text-anchor="middle" font-size="11" font-weight="bold">END</text>

<!-- ─────────────────────────────────────────────
     CODING ROUND branch (dashed) from USER SELECTS DOMAIN
     ───────────────────────────────────────────── -->
<line x1="610" y1="280" x2="610" y2="340" stroke="#4477aa" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr)"/>

<rect x="530" y="340" width="160" height="40" rx="6" fill="#b8d4e8" stroke="#4477aa" stroke-width="2"/>
<text x="610" y="357" text-anchor="middle" font-size="11" font-weight="bold">CODING ROUND</text>
<text x="610" y="372" text-anchor="middle" font-size="11" font-weight="bold">MODULE (MCQ+Open)</text>

<line x1="530" y1="360" x2="500" y2="450" stroke="#4477aa" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr)"/>

<!-- ─────────────────────────────────────────────
     LEGEND
     ───────────────────────────────────────────── -->
<rect x="30" y="860" width="14" height="14" fill="#d0d0d0" stroke="#555" stroke-width="1.5"/>
<text x="50" y="872" font-size="10" fill="#333">Process</text>

<ellipse cx="140" cy="867" rx="22" ry="11" fill="#e0e0e0" stroke="#555" stroke-width="1.5"/>
<text x="168" y="872" font-size="10" fill="#333">Terminal</text>

<polygon points="270,857 305,867 270,877 235,867" fill="#d0d0d0" stroke="#555" stroke-width="1.5"/>
<text x="315" y="872" font-size="10" fill="#333">Decision</text>

<rect x="420" y="860" width="14" height="14" fill="#b8d4e8" stroke="#4477aa" stroke-width="1.5"/>
<text x="440" y="872" font-size="10" fill="#333">Coding Round</text>

<rect x="570" y="860" width="14" height="14" fill="#c8dfc8" stroke="#447744" stroke-width="1.5"/>
<text x="590" y="872" font-size="10" fill="#333">Score &amp; Feedback</text>

<line x1="720" y1="867" x2="760" y2="867" stroke="#444" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)"/>
<text x="768" y="872" font-size="10" fill="#333">Optional Branch</text>

</svg>
</body>
</html>
